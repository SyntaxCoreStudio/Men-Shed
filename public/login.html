<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carina Men's Shed | Login</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Favicon and app icons -->
    <link rel="shortcut icon" href="favicon/favicon.ico" type="image/x-icon" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="favicon/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="favicon/favicon-48x48.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="64x64"
      href="favicon/favicon-64x64.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="favicon/favicon-128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="256x256"
      href="favicon/favicon-256x256.png"
    />
    <link
      rel="icon"

    />

      rel="apple-touch-icon"
      sizes="180x180"
      href="favicon/favicon-180x180.png"
    />
    <meta name="theme-color" content="#1a4fa3" />
    <link rel="manifest" href="favicon/site.webmanifest" />
  </head>

  <body>
    <section class="member-login">
      <div class="section-text card login-card">
        <h2 class="heading-wood">Member Login</h2>

        <form id="loginForm">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" required />
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" required />
          </div>

          <button type="submit" id="loginBtn">Log In</button>
        </form>
        <br>
        <hr>
        <br>
    <div>
        <a href="index.html">Not a member? Return to home page.</a>
    </div>

        <p id="loginMessage"></p>
      </div>
      
    </section>

    <script type="module" src="members-login.js"></script>
  </body>
</html>
